name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Ubuntu 24.04 hosted-image AppArmor blocks this unprivileged browser sandbox.
    # Keep Chromium sandbox enabled and use a supported image with user namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/index.js
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
